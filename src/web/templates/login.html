{% extends "base.html" %}
{% block content %}

<h3 class="mb-3">Staff login</h3>

<form method="post" class="row g-3" action="{{ url_for('login') }}">
  <input type="hidden" name="next" value="{{ next }}">

  <div class="col-md-6">
    <label class="form-label">Username *</label>
    <input name="username" class="form-control" required autocomplete="username">
  </div>

  <div class="col-md-6">
    <label class="form-label">Password *</label>
    <input name="password" type="password" class="form-control" required autocomplete="current-password">
  </div>
  
  <div class="col-12">
    <button class="btn btn-success">Login</button>
    <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancel</a>
  </div>

  <div class="col-12">
  <div class="form-check">
    <input class="form-check-input" type="checkbox" value="1" id="remember" name="remember">
    <label class="form-check-label" for="remember">
      Remember me
    </label>
  </div>
  </div>

  <div class="col-12 mt-2">
    <small class="text-muted">
      Not registered yet?
      <a href="{{ url_for('register') }}">Create an account</a>
    </small>
  </div>
</form>


{% endblock %}
